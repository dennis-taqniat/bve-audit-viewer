<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/S0Kmz9RvESfd+WZhKcO7OXEt0z87ur663U79TvjP+U='; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"><meta name="robots" content="noindex">
<title>BVE audit trail</title>
<style>
:root{color-scheme:light dark;
  --bg:#fff;--fg:#18181b;--mut:#52525b;--line:#e4e4e7;--line-strong:#d4d4d8;--sunken:#f4f4f5;
  --acc:#2563eb;--acc-fg:#fff;--bad:#b91c1c;--add:#166534;--del:#991b1b;
  --focus:0 0 0 2px var(--bg),0 0 0 4px var(--acc);
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Text',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{
  --bg:#09090b;--fg:#fafafa;--mut:#a1a1aa;--line:#27272a;--line-strong:#3f3f46;--sunken:#18181b;
  --bad:#f87171;--add:#86efac;--del:#fca5a5}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/24px var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
::selection{background:color-mix(in srgb,var(--acc) 30%,transparent)}
.mono{font-family:var(--mono);font-size:13px;line-height:20px}
.mut{color:var(--mut)}
.skip{position:absolute;left:12px;top:-48px;padding:8px 12px;background:var(--acc);color:var(--acc-fg);border-radius:6px;text-decoration:none}
.skip:focus{top:8px}
.field{min-height:44px;width:100%;padding:0 12px;background:var(--bg);border:1px solid var(--line-strong);border-radius:6px}
.field:focus{outline:none;border-color:var(--acc);box-shadow:var(--focus)}
.btn{min-height:44px;padding:0 16px;background:var(--acc);color:var(--acc-fg);border:0;border-radius:6px;font-weight:500;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.6;cursor:default}
.link{min-height:44px;padding:0 4px;background:none;border:0;color:var(--mut);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--fg)}

.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate form{width:100%;max-width:340px;display:grid;gap:16px}
.gate h1{margin:0;font-size:20px;line-height:28px;font-weight:600}
.gate p{margin:4px 0 0}
.gate label{display:grid;gap:6px;font-weight:500}
.err{min-height:24px;color:var(--bad)}

main{max-width:760px;margin:0 auto;padding:32px 20px 64px}
header{display:flex;align-items:baseline;gap:12px}
header h1{margin:0;font-size:20px;line-height:28px;font-weight:600;flex:1 1 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:20px 0 8px}
.bar .field{flex:1 1 220px;width:auto}
.bar select{width:auto;min-width:150px}
.count{color:var(--mut);padding:4px 0 8px;min-height:32px}
.day{margin:32px 0 4px;font-size:13px;line-height:20px;font-weight:600;color:var(--mut)}
ol{list-style:none;margin:0;padding:0}
li.e{display:grid;grid-template-columns:96px 1fr;gap:0 16px;padding:14px 0;border-top:1px solid var(--line)}
.time{white-space:nowrap;color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.head{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.head b{font-weight:600}
.refused{color:var(--bad);font-weight:600}
.diffs{display:grid;grid-template-columns:max-content 1fr;gap:2px 16px;margin:6px 0 0}
.diffs .el{grid-column:1/-1;margin-top:6px;font-weight:600}
.diffs .el:first-child{margin-top:0}
.del{color:var(--del);text-decoration:line-through;text-decoration-thickness:1px}
.add{color:var(--add)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--line-strong);vertical-align:-1px;margin-right:4px}
.meta{margin-top:6px;color:var(--mut);font-size:13px;line-height:20px;overflow-wrap:anywhere}
.empty{padding:48px 0;color:var(--mut)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
@media (max-width:560px){main{padding:20px 16px 48px}li.e{grid-template-columns:1fr;gap:2px}.diffs{grid-template-columns:1fr;gap:0}.diffs .el{margin-top:8px}.bar select{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="gate" id="gate"><form id="lock">
  <div><h1>Audit trail</h1><p class="mut">Enter the password to read the log. It stays in your browser.</p></div>
  <label>Password<input class="field" id="pw" type="password" autocomplete="current-password" required autofocus aria-describedby="err"></label>
  <button class="btn" type="submit" id="unlock">Unlock</button>
  <div class="err" id="err" role="alert"></div>
</form></div>
<div id="app" hidden>
<a class="skip" href="#log">Skip to the log</a>
<main>
  <header><h1>Audit trail<span class="mut" id="project" style="font-weight:400"></span></h1><button class="link" id="relock" type="button">Lock</button></header>
  <div class="bar">
    <input class="field" id="q" type="search" enterkeyhint="search" placeholder="Search element, property or file" aria-label="Search">
    <select class="field" id="view" aria-label="Show">
      <option value="changes">Changes</option>
      <option value="refused">Refused only</option>
      <option value="all">All activity</option>
    </select>
    <button class="link" id="export" type="button">Export CSV</button>
  </div>
  <div class="count" id="foot" role="status"></div>
  <div id="log" tabindex="-1"></div>
</main></div>
<script>
const $=id=>document.getElementById(id);
let data={records:[],skipped:0,truncated:false,project:'',loadedAt:0};
const f={view:'changes',q:''};
const VERB={connect:'Connected',diff:'Reviewed diff',apply:'Applied',discard:'Discarded review',undo:'Undid',redo:'Redid'};
const CHANGES=['apply','undo','redo'];
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function short(id){return id?id.replace('sess_','').slice(0,8):'';}
function dayLabel(d){
  const n=new Date(),s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((s(n)-s(d))/86400000);
  if(diff===0)return'Today';if(diff===1)return'Yesterday';
  return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:d.getFullYear()===n.getFullYear()?undefined:'numeric'});
}
function colorish(v){return v.startsWith('#')||v.startsWith('rgb')||v.startsWith('hsl');}
function val(cls,v){const s=h('span',cls);if(colorish(v)){const w=h('i','sw');w.style.background=v;s.appendChild(w);}s.appendChild(document.createTextNode(v||'unset'));return s;}
function matches(r){
  if(f.view==='changes'&&!CHANGES.includes(r.event))return false;
  if(f.view==='refused'&&r.outcome!=='refused')return false;
  if(f.q&&!JSON.stringify([r.edits,r.files,r.session,r.code]).toLowerCase().includes(f.q.toLowerCase()))return false;
  return true;
}
function entry(r){
  const li=h('li','e');
  const t=h('time','time',new Date(r.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  t.dateTime=r.at;t.title=new Date(r.at).toLocaleString();li.appendChild(t);
  const c=h('div');const head=h('div','head');
  head.appendChild(h('b',null,VERB[r.event]||r.event));
  if(r.outcome==='refused')head.appendChild(h('span','refused','Refused'+(r.code?' · '+r.code:'')));
  c.appendChild(head);
  if(r.edits&&r.edits.length){const d=h('div','diffs');
    for(const e of r.edits){d.appendChild(h('div','mono el',e.element));
      for(const x of e.changes){d.appendChild(h('span','mono mut',x.prop));const v=h('span','mono');v.appendChild(val('del',x.from));v.appendChild(document.createTextNode('  →  '));v.appendChild(val('add',x.to));d.appendChild(v);}}
    c.appendChild(d);}
  const meta=[];
  if(r.files&&r.files.length)meta.push(r.files.join(', '));
  if(r.session)meta.push('session '+short(r.session));
  if(meta.length){const m=h('div','meta mono',meta.join('  ·  '));if(r.origin)m.title=r.origin;c.appendChild(m);}
  li.appendChild(c);return li;
}
function render(){
  const rows=data.records.filter(matches);
  $('project').textContent=data.project?'  '+data.project:'';
  const log=$('log');log.replaceChildren();
  let day='',list=null;
  for(const r of rows){const d=dayLabel(new Date(r.at));
    if(d!==day){day=d;log.appendChild(h('h2','day',d));list=h('ol');log.appendChild(list);}
    list.appendChild(entry(r));}
  if(!rows.length){const e=h('div','empty');
    if(data.records.length){e.appendChild(h('b',null,'Nothing to show'));e.appendChild(h('span',null,f.view==='changes'?'No changes match. Try All activity.':'No entries match.'));}
    else{e.appendChild(h('b',null,'No activity yet'));e.appendChild(h('span',null,'Changes applied in the editor appear here.'));}
    log.appendChild(e);}
  tick(rows.length);
}
let shown=0;
function tick(n){if(n!==undefined)shown=n;$('foot').textContent=shown+(shown===1?' entry':' entries')+(data.truncated?' · older entries not loaded':'')+(data.skipped?' · '+data.skipped+' unreadable lines skipped':'');}
function csvCell(v){const s=String(v===undefined?'':v);return /[",\n]/.test(s)?'"'+s.split('"').join('""')+'"':s;}
function exportCsv(){
  const out=[['time','event','outcome','code','element','property','from','to','files','session','origin'].join(',')];
  for(const r of data.records.filter(matches)){
    const base=[r.at,r.event,r.outcome,r.code||''],tail=[(r.files||[]).join(' '),r.session||'',r.origin||''];
    const ch=(r.edits||[]).flatMap(e=>e.changes.map(c=>[e.element,c.prop,c.from,c.to]));
    if(!ch.length)out.push([...base,'','','','',...tail].map(csvCell).join(','));
    for(const c of ch)out.push([...base,...c,...tail].map(csvCell).join(','));}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.join('\n')+'\n'],{type:'text/csv'}));a.download='audit-trail.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('q').addEventListener('input',e=>{f.q=e.target.value;render();});
$('view').addEventListener('change',e=>{f.view=e.target.value;render();});
$('export').addEventListener('click',exportCsv);
addEventListener('keydown',e=>{
  const typing=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement&&document.activeElement.tagName);
  if(e.key==='/'&&!typing&&!$('app').hidden){e.preventDefault();$('q').focus();}
  if(e.key==='Escape'&&document.activeElement===$('q')){$('q').value='';f.q='';render();$('q').blur();}
});

async function decryptAudit(blob,password){
  const b=JSON.parse(blob);
  if(b.v!==1||b.kdf!=='PBKDF2-SHA256'||!(b.iter>=100000&&b.iter<=2000000))throw new Error('unsupported file');
  const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(b.salt),iterations:b.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(b.iv)},key,u(b.ct)));
}

const MAX=5000;
function parse(text){
  const records=[];let skipped=0;
  for(const line of text.split('\n')){if(!line.trim())continue;
    try{const r=JSON.parse(line);if(r&&typeof r.at==='string'&&typeof r.event==='string'&&typeof r.outcome==='string')records.push(r);else skipped++;}catch{skipped++;}}
  records.reverse();
  return{records:records.slice(0,MAX),skipped,truncated:records.length>MAX,project:records.length?records[0].project||'':'',loadedAt:Date.now()};
}
let password='',last='',timer=0;
async function fetchBlob(){
  const r=await fetch('audit.enc',{cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.text();
}
function fail(msg){$('err').textContent=msg;}
async function refresh(first){
  let blob;
  try{blob=await fetchBlob();}catch(e){if(first)fail('Could not load the log: '+e.message);return false;}
  if(blob===null){if(first)fail('No audit log has been published yet.');return false;}
  if(blob===last){data.loadedAt=Date.now();return true;}
  try{data=parse(await decryptAudit(blob,password));last=blob;}
  catch{if(first)fail('Wrong password, or the file is damaged.');else{lockUp('The log changed and no longer opens with this password.');}return false;}
  $('gate').hidden=true;$('app').hidden=false;render();return true;
}
function lockUp(msg){
  clearInterval(timer);password='';last='';data={records:[],skipped:0,truncated:false,project:'',loadedAt:0};
  $('app').hidden=true;$('gate').hidden=false;$('pw').value='';fail(msg||'');$('pw').focus();
}
$('lock').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=$('unlock');b.disabled=true;b.textContent='Unlocking…';fail('');
  password=$('pw').value;
  const ok=await refresh(true);
  b.disabled=false;b.textContent='Unlock';
  if(ok){$('pw').value='';timer=setInterval(()=>refresh(false),30000);}else password='';
});
$('relock').addEventListener('click',()=>lockUp(''));
</script></body></html>
