<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-xqhd+Y1GrsgTrx9JpnmNu6h4k9lRjdhdVtj5ivrHN4E='; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"><meta name="robots" content="noindex">
<title>BVE audit trail</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#2563eb;--bad:#b91c1c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--fg:#e2e8f0;--mut:#94a3b8;--line:#1e293b;--acc:#60a5fa;--bad:#f87171;--ok:#4ade80}}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
h1{font-size:15px;margin:0;flex:1 1 auto}
select,input,button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}
main{padding:0 20px 24px}
.note{color:var(--mut);padding:10px 0}
.lock{display:flex;gap:8px;align-items:center;padding:20px 0}
.lock[hidden]{display:none}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--bg)}
td.mono,.mono{font:12px/1.5 ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.ok{color:var(--ok)}.refused{color:var(--bad)}
@media (max-width:640px){th:nth-child(n+5),td:nth-child(n+5){display:none}}
</style></head><body>
<header><h1 id="title">Audit trail</h1>
<label>Event <select id="ev"><option value="">all</option><option>connect</option><option>diff</option><option>apply</option><option>discard</option><option>undo</option><option>redo</option></select></label>
<label>Outcome <select id="oc"><option value="">all</option><option>ok</option><option>refused</option></select></label>
<input id="q" type="search" placeholder="Search element, property, file, session" aria-label="Search">
</header>
<main>
<form class="lock" id="lock"><label>Password <input id="pw" type="password" autocomplete="current-password" required minlength="1" autofocus></label> <button type="submit">Unlock</button></form>
<div class="note" id="note" role="status"></div>
<table><thead><tr><th>Time</th><th>Outcome</th><th>Event</th><th>Element and changes</th><th>Files</th><th>Session</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const $=id=>document.getElementById(id);
let data={records:[],skipped:0,truncated:false,project:''};
function cell(tr,text,cls){const td=document.createElement('td');td.textContent=text;if(cls)td.className=cls;tr.appendChild(td);}
function render(){
  const ev=$('ev').value,oc=$('oc').value,q=$('q').value.toLowerCase();
  const rows=data.records.filter(r=>(!ev||r.event===ev)&&(!oc||r.outcome===oc)&&(!q||JSON.stringify([r.edits,r.files,r.origin,r.session,r.code]).toLowerCase().includes(q)));
  const body=$('rows');body.replaceChildren();
  for(const r of rows){const tr=document.createElement('tr');
    cell(tr,new Date(r.at).toLocaleString());
    cell(tr,r.outcome+(r.code?' ('+r.code+')':''),r.outcome);
    cell(tr,r.event);
    const el=document.createElement('td');el.className='mono';
    for(const e of r.edits||[]){const b=document.createElement('div');b.textContent=e.element;b.style.fontWeight='600';el.appendChild(b);
      for(const c of e.changes){const l=document.createElement('div');l.textContent=c.prop+': '+(c.from||'unset')+' → '+c.to;l.style.color='var(--mut)';el.appendChild(l);}}
    tr.appendChild(el);
    cell(tr,(r.files||[]).join('\n'),'mono');
    cell(tr,r.session||'','mono');tr.lastChild.title=r.origin||'';body.appendChild(tr);}
  $('title').textContent='Audit trail'+(data.project?' · '+data.project:'');
  $('note').textContent=rows.length+' of '+data.records.length+' records'+(data.truncated?' (older records not loaded)':'')+(data.skipped?' · '+data.skipped+' unreadable lines skipped':'');
}
for(const id of['ev','oc','q'])$(id).addEventListener('input',render);

async function decryptAudit(blob,password){
  const b=JSON.parse(blob);
  if(b.v!==1||b.kdf!=='PBKDF2-SHA256'||!(b.iter>=100000&&b.iter<=2000000))throw new Error('unsupported file');
  const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(b.salt),iterations:b.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(b.iv)},key,u(b.ct)));
}

const MAX=5000;
function parse(text){
  const records=[];let skipped=0;
  for(const line of text.split('\n')){if(!line.trim())continue;
    try{const r=JSON.parse(line);if(r&&typeof r.at==='string'&&typeof r.event==='string'&&typeof r.outcome==='string')records.push(r);else skipped++;}catch{skipped++;}}
  records.reverse();
  return{records:records.slice(0,MAX),skipped,truncated:records.length>MAX,project:records.length?records[0].project||'':''};
}
let password='',last='';
async function fetchBlob(){
  const r=await fetch('audit.enc',{cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.text();
}
async function refresh(first){
  let blob;
  try{blob=await fetchBlob();}catch(e){$('note').textContent='Could not load the log: '+e.message;return false;}
  if(blob===null){$('note').textContent='No audit log has been published yet.';return false;}
  if(blob===last)return true;
  try{data=parse(await decryptAudit(blob,password));last=blob;}
  catch{if(first)$('note').textContent='Wrong password, or the file is damaged.';else $('note').textContent='The log changed and no longer opens with this password. Reload and unlock again.';return false;}
  $('lock').hidden=true;render();return true;
}
$('lock').addEventListener('submit',async e=>{
  e.preventDefault();
  password=$('pw').value;$('note').textContent='Unlocking…';
  const ok=await refresh(true);
  if(ok){$('pw').value='';setInterval(()=>refresh(false),30000);}else password='';
});
render();
</script></body></html>
