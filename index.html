<style>

.tdc-btn[data-variant=outline]{border-color:var(--tdc-input);background:var(--tdc-background);}
.tdc-btn[data-variant=outline]:hover:not(:disabled){background:var(--tdc-accent);color:var(--tdc-accent-foreground);}

.tdc-input{--h:var(--tdc-target);display:block;width:100%;height:var(--h);min-height:var(--h);padding:0 12px;border:1px solid var(--tdc-input);border-radius:var(--tdc-radius-md);background:var(--tdc-background);color:var(--tdc-foreground);font:400 14px/20px var(--tdc-font-sans);transition:border-color .12s;}

textarea.tdc-input{height:auto;min-height:96px;padding:10px 12px;resize:vertical;}
.tdc-input::placeholder{color:var(--tdc-muted-foreground);}
.tdc-input:hover:not(:disabled){border-color:var(--tdc-muted-foreground);}

const ICON={"lock":"<rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/>","search":"<path d=\"m21 21-4.34-4.34\"/><circle cx=\"11\" cy=\"11\" r=\"8\"/>","download":"<path d=\"M12 15V3\"/><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/><path d=\"m7 10 5 5 5-5\"/>","triangle-alert":"<path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/>","arrow-right":"<path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/>","file-code":"<path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\"/><path d=\"M14 2v5a1 1 0 0 0 1 1h5\"/><path d=\"M10 12.5 8 15l2 2.5\"/><path d=\"m14 12.5 2 2.5-2 2.5\"/>","chevron-down":"<path d=\"m6 9 6 6 6-6\"/>","user":"<path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/>","eye":"<path d=\"M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>","eye-off":"<path d=\"M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49\"/><path d=\"M14.084 14.158a3 3 0 0 1-4.242-4.242\"/><path d=\"M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143\"/><path d=\"m2 2 20 20\"/>","loader-circle":"<path d=\"M21 12a9 9 0 1 1-6.219-8.56\"/>","shield-check":"<path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/><path d=\"m9 12 2 2 4-4\"/>"};
function ic(n,s){const e=document.createElement('span');e.innerHTML='<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';return e.firstChild;}
let data={records:[],skipped:0,truncated:false,project:'',loadedAt:0};
const f={view:'changes',q:'',who:''};
const VERB={connect:'Connected',diff:'Reviewed diff',apply:'Applied',discard:'Discarded review',undo:'Undid',redo:'Redid'};
const CHANGES=['apply','undo','redo'];
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function short(id){return id?id.replace('sess_','').slice(0,8):'';}
function dayLabel(d){
  const n=new Date(),s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((s(n)-s(d))/86400000);
  if(diff===0)return'Today';if(diff===1)return'Yesterday';
  return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:d.getFullYear()===n.getFullYear()?undefined:'numeric'});
}
function colorish(v){return v.startsWith('#')||v.startsWith('rgb')||v.startsWith('hsl');}
function val(cls,v){const s=h('span',cls);if(colorish(v)){const w=h('i','sw');w.style.background=v;s.appendChild(w);}s.appendChild(document.createTextNode(v||'unset'));return s;}
function matches(r){
  if(f.view==='changes'&&!CHANGES.includes(r.event))return false;
  if(f.view==='refused'&&r.outcome!=='refused')return false;
  if(f.who&&(r.actor&&r.actor.name||'unknown')!==f.who)return false;
  if(f.q&&!JSON.stringify([r.edits,r.files,r.session,r.code,r.actor]).toLowerCase().includes(f.q.toLowerCase()))return false;
  return true;
}
function entry(r){
  const li=h('li','e');
  const t=h('time','time',new Date(r.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  t.dateTime=r.at;t.title=new Date(r.at).toLocaleString();li.appendChild(t);
  const c=h('div');const head=h('div','head');
  head.appendChild(h('b',null,VERB[r.event]||r.event));
  if(r.outcome==='refused'){const x=h('span','tdc-badge');x.dataset.variant='destructive';x.style.cssText='margin-left:auto;gap:6px;';x.appendChild(ic('triangle-alert',14));x.appendChild(document.createTextNode('Refused'+(r.code?' · '+r.code:'')));head.appendChild(x);}
  c.appendChild(head);
  if(r.edits&&r.edits.length){const d=h('div','diffs');
    for(const e of r.edits){d.appendChild(h('div','mono el',e.element));
      for(const x of e.changes){d.appendChild(h('span','mono mut',x.prop));const v=h('span','mono');v.appendChild(val('del',x.from));v.appendChild(document.createTextNode(' '));v.appendChild(ic('arrow-right',12));v.appendChild(document.createTextNode(' '));v.appendChild(val('add',x.to));d.appendChild(v);}}
    c.appendChild(d);}
  const parts=[];
  const seg=(icon,text,title)=>{const e=h('span','seg');if(icon)e.appendChild(ic(icon,13));e.appendChild(document.createTextNode((icon?' ':'')+text));if(title)e.title=title;parts.push(e);};
  if(r.files&&r.files.length)seg('file-code',r.files.join(', '));
  const a=r.actor;
  seg('user',(a&&a.name)||'unknown');
  if(a&&a.email&&a.email!==a.name)seg(null,a.email);
  if(a&&a.machine&&a.machine!==a.name)seg(null,a.machine+(a.ip?' ('+a.ip+')':''));
  else if(a&&a.ip)seg(null,a.ip);
  if(r.session)seg(null,'session '+short(r.session),r.origin||'');
  const m=h('div','meta mono');
  parts.forEach((p,i)=>{if(i)m.appendChild(document.createTextNode('  ·  '));m.appendChild(p);});
  c.appendChild(m);
  li.appendChild(c);return li;
}
function people(){
  const names=[...new Set(data.records.map(r=>(r.actor&&r.actor.name)||'unknown'))].sort();
  const sel=$('who');const keep=names.includes(f.who)?f.who:'';f.who=keep;
  sel.replaceChildren();const all=h('option',null,'Everyone');all.value='';sel.appendChild(all);
  for(const n of names){const o=h('option',null,n);o.value=n;sel.appendChild(o);}
  sel.value=keep;$('whoWrap').hidden=names.length<2;
}
function render(){
  people();
  const rows=data.records.filter(matches);
  const pj=$('project');pj.hidden=!data.project;pj.textContent=data.project||'';
  const log=$('log');log.replaceChildren();
  let day='',list=null;
  for(const r of rows){const d=dayLabel(new Date(r.at));
    if(d!==day){day=d;log.appendChild(h('h2','day',d));list=h('ol');log.appendChild(list);}
    list.appendChild(entry(r));}
  if(!rows.length){const e=h('div','empty');
    if(data.records.length){e.appendChild(h('b',null,'Nothing to show'));e.appendChild(h('span',null,f.view==='changes'?'No changes match. Try All activity.':'No entries match.'));}
    else{e.appendChild(h('b',null,'No activity yet'));e.appendChild(h('span',null,'Changes applied in the editor appear here.'));}
    log.appendChild(e);}
  tick(rows.length);
}
let shown=0;
function tick(n){if(n!==undefined)shown=n;$('foot').textContent=shown+(shown===1?' entry':' entries')+(data.truncated?' · older entries not loaded':'')+(data.skipped?' · '+data.skipped+' unreadable lines skipped':'');}
function csvCell(v){const s=String(v===undefined?'':v);return /[",\n]/.test(s)?'"'+s.split('"').join('""')+'"':s;}
function exportCsv(){
  const out=[['time','event','outcome','code','person','email','machine','ip','element','property','from','to','files','session','origin'].join(',')];
  for(const r of data.records.filter(matches)){
    const a=r.actor||{},base=[r.at,r.event,r.outcome,r.code||'',a.name||'unknown',a.email||'',a.machine||'',a.ip||''],tail=[(r.files||[]).join(' '),r.session||'',r.origin||''];
    const ch=(r.edits||[]).flatMap(e=>e.changes.map(c=>[e.element,c.prop,c.from,c.to]));
    if(!ch.length)out.push([...base,'','','','',...tail].map(csvCell).join(','));
    for(const c of ch)out.push([...base,...c,...tail].map(csvCell).join(','));}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.join('\n')+'\n'],{type:'text/csv'}));a.download='audit-trail.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('q').addEventListener('input',e=>{f.q=e.target.value;render();});
$('view').addEventListener('change',e=>{f.view=e.target.value;render();});
$('who').addEventListener('change',e=>{f.who=e.target.value;render();});
$('export').addEventListener('click',exportCsv);
addEventListener('keydown',e=>{
  const typing=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement&&document.activeElement.tagName);
  if(e.key==='/'&&!typing&&!$('app').hidden){e.preventDefault();$('q').focus();}
  if(e.key==='Escape'&&document.activeElement===$('q')){$('q').value='';f.q='';render();$('q').blur();}
});

const KEYS=new Map();
async function decryptAudit(blob,password){
  const b=JSON.parse(blob);
  if(b.v!==1||b.kdf!=='PBKDF2-SHA256'||!(b.iter>=100000&&b.iter<=2000000))throw new Error('unsupported file');
  const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const id=password+'|'+b.salt+'|'+b.iter;
  if(!KEYS.has(id))KEYS.set(id,(async()=>{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(b.salt),iterations:b.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  })());
  const key=await KEYS.get(id);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(b.iv)},key,u(b.ct)));
}

const REPO="dennis-taqniat/bve-audit-viewer",BRANCH="main",DIR="logs";
const MAX=5000;
function parseLines(text){
  const records=[];let skipped=0;
  for(const line of text.split('\n')){if(!line.trim())continue;
    try{const r=JSON.parse(line);if(r&&typeof r.at==='string'&&typeof r.event==='string'&&typeof r.outcome==='string')records.push(r);else skipped++;}catch{skipped++;}}
  return{records,skipped};
}
let password='',timer=0;
const cache=new Map();
async function listFiles(){
  // The relay keeps an index beside the logs, served from this origin with no rate limit.
  const m=await fetch(DIR+'/index.json',{cache:'no-store'});
  if(m.ok){const j=await m.json();return(j.files||[]).map(f=>({path:f.path,sha:String(f.v)}));}
  // No index yet: fall back to the GitHub API, which allows 60 calls an hour per address.
  const r=await fetch('https://api.github.com/repos/'+REPO+'/git/trees/'+BRANCH+'?recursive=1',{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404)return[];
  if(r.status===403||r.status===429){const t=Number(r.headers.get('x-ratelimit-reset'))*1000;throw new Error('GitHub is limiting requests'+(t?'. Try again at '+new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''));}
  if(!r.ok)throw new Error('GitHub answered '+r.status);
  return(await r.json()).tree.filter(x=>x.type==='blob'&&x.path.startsWith(DIR+'/')&&x.path.endsWith('.enc'));
}
async function load(){
  const list=await listFiles();
  if(!list.length)return{empty:true};
  await Promise.all(list.filter(f=>!cache.has(f.sha)).map(async f=>{
    const res=await fetch(f.path,{cache:'no-store'});
    if(!res.ok)return;
    try{cache.set(f.sha,parseLines(await decryptAudit(await res.text(),password)));}catch{cache.set(f.sha,null);}
  }));
  const good=list.map(f=>cache.get(f.sha)).filter(Boolean);
  if(!good.length)return list.some(f=>cache.get(f.sha)===null)?{badPassword:true}:{empty:true};
  const all=good.flatMap(g=>g.records).sort((a,b)=>Date.parse(b.at)-Date.parse(a.at));
  return{data:{records:all.slice(0,MAX),skipped:good.reduce((n,g)=>n+g.skipped,0),truncated:all.length>MAX,project:all.length?all[0].project||'':'',loadedAt:Date.now()}};
}
function fail(msg){$('err').textContent=msg;const p=$('pw');if(msg)p.setAttribute('aria-invalid','true');else p.removeAttribute('aria-invalid');}
async function refresh(first){
  let res;
  try{res=await load();}catch(e){if(first)fail('Could not load the logs: '+e.message);return false;}
  if(res.empty){if(first)fail('No audit log has been published yet.');return false;}
  if(res.badPassword){if(first)fail('Wrong password, or a file is damaged.');else lockUp('The logs no longer open with this password.');return false;}
  data=res.data;$('gate').hidden=true;$('app').hidden=false;render();return true;
}
function lockUp(msg){
  clearInterval(timer);password='';cache.clear();data={records:[],skipped:0,truncated:false,project:'',loadedAt:0};
  $('app').hidden=true;$('gate').hidden=false;$('pw').value='';fail(msg||'');$('pw').focus();
}
$('lock').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!$('pw').value){fail('Enter the password.');$('pw').focus();return;}
  const b=$('unlock');b.disabled=true;$('ulabel').textContent='Checking…';$('spin').hidden=false;fail('');
  cache.clear();password=$('pw').value;
  const ok=await refresh(true);
  b.disabled=false;$('ulabel').textContent='Unlock';$('spin').hidden=true;
  if(!ok)$('pw').focus();
  if(ok){$('pw').value='';timer=setInterval(()=>refresh(false),120000);}else password='';
});
$('reveal').addEventListener('click',()=>{
  const show=$('pw').type==='password';
  $('pw').type=show?'text':'password';$('eye').hidden=show;$('eyeoff').hidden=!show;
  $('reveal').setAttribute('aria-pressed',String(show));$('reveal').setAttribute('aria-label',show?'Hide password':'Show password');
});
$('pw').addEventListener('keydown',e=>{$('caps').hidden=!(e.getModifierState&&e.getModifierState('CapsLock'));});
$('pw').addEventListener('keyup',e=>{$('caps').hidden=!(e.getModifierState&&e.getModifierState('CapsLock'));});
$('pw').addEventListener('blur',()=>{$('caps').hidden=true;});
$('relock').addEventListener('click',()=>lockUp(''));
</script></body></html>
